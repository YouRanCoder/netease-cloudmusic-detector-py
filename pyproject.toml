[project]
name = "netease-cloudmusic-detector"
version = "1.0.0"
description = "使用 Python 监听网易云音乐客户端正在播放中的音乐，支持获取 SongId、暂停状态、歌曲进度"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Python Reproduction" }
]
keywords = ["netease", "cloudmusic", "detector", "music"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
]
dependencies = []

[project.scripts]
cloudmusic-detector = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
packages = ["cloudmusic_detector"]

[dependency-groups]
dev = ["pytest >= 8.0"]

[tool.hatch.build.targets.wheel]
packages = ["cloudmusic_detector"]
